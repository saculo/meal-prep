# Every pull request and every push to main: the Go and web checks, then the image
# ghcr.io/saculo/meal-prep:<commit>. A pull request's image is what its preview runs.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - name: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: web
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build

  image:
    name: image
    needs: checks
    # a fork's pull request gets no package token
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build and push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          # the pull request's head commit, not GitHub's merge commit: the preview asks for it
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          image="ghcr.io/saculo/meal-prep:$SHA"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --build-arg VERSION="$SHA" -t "$image" .
          docker push "$image"
